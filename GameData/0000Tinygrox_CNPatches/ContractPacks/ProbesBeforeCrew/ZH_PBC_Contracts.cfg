	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 探索 Minmus（载人） // Explore Minmus (Crew)
