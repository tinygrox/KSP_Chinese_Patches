/////////// LAYER 3 - Duna & Eve ///////////

@CONTRACT_TYPE[ProbeKerbol]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：Kerbol // Locked achievement at Kerbol.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 探索 Kerbol（探测器） // Explore Kerbol (Probe)
	@description = 我们的中央孤独恒星正是我们能有这个美妙行星系统可以探索的根本原因！至少我们应该顺路过去，礼貌地问声好。 // Our central solitary star is the whole reason we even have this wonderful planetary system to explore in the first place! The least we could do is stop by for a proper, polite hello.
	@synopsis = 进入行星际空间，俯冲进 Kerbol 的日冕，并将探测器安全带回。 // Reach Interplanetary Space, dive into the corona of Kerbol, and return the Probe home safely.
	@completedMessage = 我们的探测器经历了一场难以置信的考验，挑战了我们所能制造的最佳材料的极限。这次任务收集到的数据对未来探索工作将是无价之宝。 // Our probe has been through an incredible ordeal, pushing the limits of the best materials we're capable of manufacturing. The data collected on this mission will prove invaluable for future exploration efforts.
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
	@PARAMETER[flybyPK]
	{
		@title = 进入行星际空间 // Enter Interplanetary Space
		@completedMessage = 所有地面卫星都能清晰追踪我们的探测器。目前预测前方是一段漫长而孤独的航程。星载系统正在准备节能协议。 // All ground satellites have clear tracking on our Probe. Currently projections indicate a long and lonely voyage ahead. On-board systems preparing energy conservation protocols.
	}
	@PARAMETER[landPK]
	{
		@title = 俯冲进入日冕 // Dive into the Corona
		@completedMessage = Kerbol 的惊人威力得到了 100% 确认，探测器上每个系统都在用坎巴拉式的方式尖叫：“快把我弄出去！”我们应该尽快离开。 // The incredible power of Kerbol is 100% confirmed, every system on board our Probe is screaming the Kerbal-equivalent of "GET ME OUT OF HERE!" We should probably leave as soon as possible.
	}
	@PARAMETER[vpg]
	{
		@title = 返回家园 // Return Home
		@PARAMETER[land]
		{
			@title = 已进入日冕 // Entered Corona
		}
		@PARAMETER[return]
		{
			@title = 已返回 // Returned
		}
	}
	@REQUIREMENT[r1]
	{
		@title = 至少完整完成 2 次本地卫星任务 // Fully Complete At Least 2 Local Moon Missions
	}
}

@CONTRACT_TYPE[ProbeDuna]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 探索 Duna（探测器） // Explore Duna (Probe)
	@description = 我们现在开始觉得自己有点像专业人士了。这将是迄今为止最大的挑战，但我们知道，凭借适当的工程设计和大量应急预案，我们一定能做到！ // We're starting to feel a bit like professionals at this now. This will be our greatest challenge yet, but we know with proper engineering and plenty of contingency plans, we can do it!
	@synopsis = 抵达 Duna，在其上着陆，并将探测器安全带回。 // Reach Duna, land on it, and return the Probe home safely.
	@completedMessage = 我们做到了！我们证明，只要合适的一队坎巴拉人在同一栋楼里协作，一切皆有可能。这次巨大成功只会激励我们的人民走得更远。迎接下一个挑战！ // We did it! We've shown that anything is possible with right team of Kerbals all working in the same building. This massive success has only emboldened our people to push even further. On to the next challenge!
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
	@PARAMETER[flybyPD]
