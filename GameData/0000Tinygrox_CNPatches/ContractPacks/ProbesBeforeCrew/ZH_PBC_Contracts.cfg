// Probes Before Crew 合同汉化补丁
// 仅汉化 ProbesBeforeCrew 的 Contract Pack（Layer 1-4）。

@AGENT[KARA]:NEEDS[ProbesBeforeCrew]
{
	@title = 坎巴拉文明成就记录局（K.A.R.A） // K.A.R.A
	@description = 这里是坎巴拉文明成就记录局（简称 K.A.R.A），我们的使命是记录并庆祝科学、技术、航空与太空探索领域的每一次进步。正是通过准确、安全地保存这些记录，我们希望能推动全体坎巴拉人不断向更远的目标迈进，坚持追寻真理，永不停止梦想。 // Here at the Kerbalkind Achievement Records Agency (or K.A.R.A for short), our mission is to record and celebrate every advance in the fields of science, technology, aeronautics, and space exploration. It is through the accurate and secure maintainance of these records that we hope to drive Kerbalkind to always reach further, to insist on finding truth, and to never stop dreaming.
}

@CONTRACT_GROUP[PBCgroup]:NEEDS[ProbesBeforeCrew]
{
	@displayName = 坎巴拉文明成就记录 // Kerbalkind Achievement Records
	@tip = 先探测器，后载人…… // Probing Crew...
}


/////////// LAYER 1 - Kerbin ///////////

@CONTRACT_TYPE[LeaveLaunchPad]:NEEDS[ProbesBeforeCrew]
{
	@title = 离开发射台！ // Leave the Launchpad!
	@description = 我们觉得这次终于成了。一款不会在发射台上立刻爆炸的火箭设计，一款至少应该能真正飞上几秒的设计。去验证这个理论吧，顺便把这道树枝做的栅栏也带上。我们可不想再重演上一任机构管理员的遭遇…… // We think we've finally done it. A rocket design that won't immediately explode on the launchpad, one that should actually fly for at least a few seconds. Go test this theory, and take this barrier made of twigs with you. We don't want another repeat of what happened to our last agency administrator...
	@synopsis = 离开 @targetBody 表面。 // Leave the surface of @targetBody.
	@completedMessage = 火箭成功发射！接下来要想办法让它完好无损地回来…… // Rocket successfully launched! Now to figure out how to get it back in one piece...
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
}

@CONTRACT_TYPE[UpperAtmosphere]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 抵达高空大气层 // Reach the Upper Atmosphere
	@description = 既然我们已经知道火箭具备飞行能力，是时候把它们推向极限了。第一步就是抵达高空大气层。 // Now that we know our rockets are flightworthy, its time to push them as far as they can go. Step one is reaching the upper atmosphere.
	@synopsis = 达到 18 公里高度。 // Achieve an altitude of 18km.
	@completedMessage = 不知为何，火箭在这个高度开始疯狂加速。我们得进一步调查。 // For some reason the rocket started furiously accelerating at these heights. We'll need to investigate further.
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
}

@CONTRACT_TYPE[EnterSpace]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 进入太空 // Enter Into Space
	@description = 我们离彻底冲出大气层已经非常近了！再往前一点……也许加更多助推器？肯定要加更多助推器。 // We are so close to escaping the atmosphere entirely! Just a bit further... Maybe more boosters? Definitely more boosters.
	@synopsis = 达到 70 公里高度。 // Achieve an altitude of 70km.
	@completedMessage = 进入浩瀚虚空！这仅仅是开始！ // Into the Great Void! This is just the beginning!
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
}

@CONTRACT_TYPE[PStableOrbit]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 建立稳定轨道 // Establish Stable Orbit
	@description = 既然我们已经知道冲出大气层是可行的（我们早就跟你说过了，Jeb！），那就看看能不能把我们的高级硬件送入轨道，再完好无损地带回来。 // So now that we know escaping the atmosphere IS possible (We told you so Jeb!), let's see if we can get our fancy hardware into orbit and then back in one piece.
	@synopsis = 进入 @targetBody 的稳定轨道，然后让探测器返回地面。 // Achieve a stable orbit around @targetBody and then return the Probe to the surface.
	@completedMessage = 这才是真正的进步！ // Now THIS is progress!
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
	@PARAMETER[p3]
	{
		@title = 已入轨 // Achieved Orbit
		@completedMessage = 哔……哔……哔…… // Beep... Beep... Beep...
	}
	@PARAMETER[vpg]
	{
		@title = 建立稳定轨道并返回 // Establish Stable Orbit & Return
		@PARAMETER[p3]
		{
			@title = 已入轨 // Achieved Orbit
		}
		@PARAMETER[p4]
		{
			@title = 已返回 // Returned
		}
	}
}

@CONTRACT_TYPE[CrewSpace]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 第一位进入太空的坎巴拉人！ // The First Kerbal In Space!
	@description = 时候到了，让我们打破一切所谓“边界”和“极限”的概念。为了全体坎巴拉人的福祉，出发去从未有人到过的地方吧！ // The time has come to shatter all concept of "boundaries" and "limits". For the benefit of all Kerbalkind, lets go where no one has gone before!
	@synopsis = 将一名坎巴拉人送入太空。 // Put a Kerbal in Space.
	@completedMessage = 我们国内的政客们已经气急败坏地着手把“不可能”这个词从坎巴拉语中删除。 // Our beloved politicians back home have already furiously begun work on banishing the word, "Impossible", from the Kerbal language.
}

@CONTRACT_TYPE[CStableOrbit]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 载人稳定轨道 // Crewed Stable Orbit
	@description = 我们只希望，实现稳定轨道所需的加速和返回所需的减速不会把我们的坎巴拉宇航员变成一滩绿色黏液——不过试错正是科学的意义所在！ // We're hoping that the acceleration needed to achieve stable orbit plus the deceleration needed to return won't turn our Kerbalnauts into a pile of green goo, but trial and error is what science is all about!
	@synopsis = 将一名坎巴拉人送入稳定轨道并安全回收。 // Put a Kerbal into a stable orbit and safely recover them.
	@completedMessage = 当我们把飞行员从返回舱中救出来时，发现他完全昏迷不醒。经过几分钟令人心悸的嗅盐和头晕目眩之后，飞行员终于回过神来，立刻开始大喊：“再来一次！再来一次！” // When we retrieved our pilot from the capsule, we found them completely unconcious. After a few scary minutes of smelling salts and dizzy eyes, our pilot seemed to snap out of it and immediately started shouting, "Again! Again!".
	@PARAMETER[vpg]
	{
		@title = 建立稳定轨道并返回 // Establish Stable Orbit & Return
		@PARAMETER[p4]
		{
			@title = 已返回 // Returned
		}
	}
}


/////////// LAYER 2 - Local Moons ///////////

@CONTRACT_TYPE[ProbeMun]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 探索 Mun（探测器） // Explore The Mun (Probe)
	@description = 我们的火箭设计进步得刚好足以尝试一次前往 Mun 的远程探测任务。我们相信借助通信卫星的巧妙运用，应该可以从离我们最近的邻居表面着陆并回收探测器。这也是为即将到来的载人任务测试概念验证的绝佳机会。 // Our rocket designs have improved just enough to attempt a remote exploration mission of The Mun. We believe with the clever use of communications satellites, it should be possible to land and recover a probe from the surface of our closest neighbor. This is also a great opportunity to test our proof-of-concept for the Crewed missions to come.
	@synopsis = 抵达 Mun，在其上着陆，并将探测器安全带回。 // Reach the Mun, land on it, and return the Probe home safely.
	@completedMessage = 我们成功了！这次任务的成功会给我们的坎巴拉宇航员带来更多信心。 // We did it! The success of this mission will give our Kerbalnauts a lot more confidence.
	@PARAMETER[p1]
	{
		@notes = 请确认你的载具类型标记为“探测器”，而不是“中继卫星”“漫游车”“残骸”等。 // Ensure that your vessel's name is tagged as a PROBE, and not RELAY, ROVER, DEBRIS, etc.
	}
	@PARAMETER[flyby]
	{
		@title = 飞掠 Mun // Fly By the Mun
		@completedMessage = 至少我们现在知道自己的计算没错了！ // Well at the very least, now we know our math checks out!
	}
	@PARAMETER[land]
	{
		@title = 在 Mun 着陆 // Land on the Mun
		@completedMessage = 着陆成功！“麻雀”已经着陆！ // Touchdown! The Sparrow has landed!
	}
	@PARAMETER[vpg]
	{
		@title = 返回家园 // Return Home
		@PARAMETER[land]
		{
			@title = 已在 Mun 着陆 // Landed on the Mun
		}
		@PARAMETER[return]
		{
			@title = 已返回 // Returned
		}
	}
}

