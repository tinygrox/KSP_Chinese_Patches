@CONTRACT_TYPE[CrewMun]:NEEDS[ProbesBeforeCrew]
{
	@genericTitle = 尚未解锁的目标：@targetBody // Locked achievement at @targetBody.
	@genericDescription = 在此之前还需完成其他成就！ // There are still things to accomplish before this!
	@title = 探索 Mun（载人） // Explore The Mun (Crew)
	@description = 就是现在！重要的时刻！让世界看看我们的实力，完成不可想象的任务。是时候在 Mun 着陆了！ // This is it! The big time! Let's show the world what we're made of and achieve the unthinkable. It's time to land on The Mun!
	@synopsis = 抵达 Mun，在其上着陆，并将乘员安全带回。 // Reach the Mun, land on it, and return the crew home safely.
	@completedMessage = 我们做到了！我们证明，只要合适的一队坎巴拉人在同一栋楼里协作，一切皆有可能。这次巨大成功只会激励我们的人民走得更远。迎接下一个挑战！ // We did it! We've shown that anything is possible with right team of Kerbals all working in the same building. This massive success has only emboldened our people to push even further. On to the next challenge!
	@PARAMETER[flyby]
	{
		@title = 飞掠 Mun // Fly By the Mun
		@completedMessage = 我们的坎巴拉宇航员报告说，Mun 上所有千姿百态的陨石坑现在都能相当清晰地目视观察到，其中一些似乎深得惊人。 // Our Kerbalnauts report that all of the incredibly varied craters on the Mun can now be visually observed quite clearly, and a few of them seem to exhibit a surprising amount of depth.
	}
	@PARAMETER[land]
	{
		@title = 在 Mun 着陆 // Land on the Mun
		@completedMessage = 着陆成功！“鹰”已经着陆！对坎巴拉人来说是不可思议的时刻，家乡各大城市的街道上已经传出举行游行的报道！ // Touchdown! The Eagle has landed! An incredible moment for Kerbalkind, there are already reports of parades taking place in the streets of every major city back home!
	}
	@PARAMETER[vpg]
	{
		@title = 返回家园 // Return Home
		@PARAMETER[land]
		{
			@title = 已在 Mun 着陆 // Landed on the Mun
		}
		@PARAMETER[return]
		{
			@title = 已返回 // Returned
		}
	}
}

