		#InlineBallutes_125_manufacturer = 坎巴拉末日工业
		#InlineBallutes_125_description = 皮纳塔是一款1.25米内嵌式环形充气减速伞。名字源于某次jed的生日派对中jeb把它当成皮纳塔砸了。适用于在高空减速轻型火箭或者在附近泳池当游泳圈。注：经12吨重量测试。
		
		// 1.875m Ballute "Small Donut"
		#InlineBallutes_1875_title = 1.875m 内嵌式充气减速伞 “小甜甜圈”
		#InlineBallutes_1875_manufacturer = 坎巴拉末日工业
		#InlineBallutes_1875_description = 小甜甜圈是一款1.875米内嵌式环形充气减速伞。适用于在高空减速轻型火箭，或者在附近泳池里游泳。注：经18吨重量测试。
		
		// 2.5m Ballute "Big Doughnut"
		#InlineBallutes_250_title = 2.5m 内嵌式充气减速伞 “大甜甜圈”
		#InlineBallutes_250_manufacturer = 坎巴拉末日工业
		#InlineBallutes_250_description = bill到现在也不知道为什么它当年试射的时候把方圆百里所有的警察都招过来了,大甜甜圈是一款2.5米内嵌式环形充气减速伞。适用于在高空减速火箭，并且能让声音变得搞笑（内部有大量氦气）。注：经36吨重量测试。
		
		// 3.75m Ballute "Glowing Star"
