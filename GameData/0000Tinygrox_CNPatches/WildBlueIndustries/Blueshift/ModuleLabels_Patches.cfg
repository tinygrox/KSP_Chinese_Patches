// Display strings for the modules supplied by Blueshift.
@PART[wbiMk2GraviticGenerator|wbiMk2WarpCore]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
{
    @MODULE[ModuleAnimateGeneric]:HAS[#startEventGUIName[Open?Docking?Shield]]
    {
        @actionGUIName = #CNPatches_Blueshift_Mod_ToggleDockShield
        @startEventGUIName = #CNPatches_Blueshift_Mod_OpenDockShield
        @endEventGUIName = #CNPatches_Blueshift_Mod_CloseDockShield
    }
}

@PART[wbiPlasmaContactorModule]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
{
    @MODULE[ModuleAnimateGeneric]:HAS[#startEventGUIName[Extend?Emitters]]
    {
        @actionGUIName = #CNPatches_Blueshift_Mod_ToggleEmitters
        @startEventGUIName = #CNPatches_Blueshift_Mod_ExtendEmitters
        @endEventGUIName = #CNPatches_Blueshift_Mod_RetractEmitters
    }
}

@PART[wbiS0PlasmaVent|wbiS1PlasmaVent|wbiS2PlasmaVent|wbiMk2PlasmaVent]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
{
    @MODULE[WBIModuleAnimation]
    {
        @startEventGUIName = #CNPatches_Blueshift_Mod_DebugStartVenting
        @endEventGUIName = #CNPatches_Blueshift_Mod_DebugStopVenting
    }
}

@PART[wbiS0BussardCollector|wbiS1BussardCollector|wbiS2BussardCollector|wbiMk2BussardCollector|wbiStardust]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
{
    @MODULE[ModuleResourceHarvester]:HAS[#ResourceName[Graviolium]]
    {
        @ConverterName = #CNPatches_Blueshift_Mod_GravioliumCollector
        @StartActionName = #CNPatches_Blueshift_Mod_StartGravioliumCollector
        @StopActionName = #CNPatches_Blueshift_Mod_StopGravioliumCollector
        @ToggleActionName = #CNPatches_Blueshift_Mod_ToggleGravioliumCollector
    }
}

@PART[wbiMk2GraviticGenerator|wbiMk2WarpCore|wbiS0Endcap|wbiS1GravimetricGenerator|wbiS1WarpCore|wbiS2GravimetricGenerator|wbiS2WarpCore|wbiS3GravimetricGenerator|wbiS3HeavyWarpSustainer|wbiS3WarpCore|wbiS3WarpEngine|wbiS3WarpSustainer|wbiMk2PropellantTank|wbiGravioliumTank*|wbiMk3S3AdapterTank|wbiS1Endcap|wbiS2Endcap|wbiS2FTLPropellantTank|wbiS3FTLPropellantTank|wbiMiniGatePlatform|wbiS2ContragravityGenerator]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
{
    @MODULE[WBIResourceTweaker]:HAS[#resourceName[Graviolium]]
    {
        @tweakEnabledName = #CNPatches_Blueshift_Mod_CheatEnableTweak
        @tweakDisabledName = #CNPatches_Blueshift_Mod_CheatDisableTweak
    }
}

@PART[wbiMk2GraviticGenerator|wbiS1GravimetricGenerator|wbiS2GravimetricGenerator|wbiS3GravimetricGenerator|wbiS3HeavyWarpSustainer|wbiS3WarpSustainer]:NEEDS[WildBlueIndustries/Blueshift]:AFTER[Blueshift]
