}

@PART[spacedust-telescope-1]:NEEDS[WildBlueIndustries/Blueshift,SpaceDust,B9PartSwitch,!WildBlueIndustries/FlyingSaucers]:FINAL
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[instrumentSlot?],@SUBTYPE[GravioliumInstrument]]
