// === Buffalo2 Integrations ===
@PART[wbiB2MicroWarpCore]:NEEDS[WildBlueIndustries/Buffalo2,WildBlueIndustries/Blueshift]:FINAL
{
    @title = #CNPatches_Blueshift_B2_Core
    @description = #CNPatches_Blueshift_B2_CoreDesc
    @manufacturer = #CNPatches_Blueshift_Part_manufacturerClassified
    @MODULE[WBIResourceTweaker]:HAS[#resourceName[Graviolium]]
    {
        @tweakEnabledName = #CNPatches_Blueshift_Mod_CheatEnableGravioliumTweak
        @tweakDisabledName = #CNPatches_Blueshift_Mod_CheatDisableGravioliumTweak
    }
    @MODULE[WBIModuleGeneratorFX]
    {
        @ConverterName = #CNPatches_Blueshift_Mod_MainPower
        @moduleDescription = #CNPatches_Blueshift_Mod_WarpCorePowerDesc
        @StartActionName = #CNPatches_Blueshift_Mod_StartMainPower
        @StopActionName = #CNPatches_Blueshift_Mod_StopMainPower
        @ToggleActionName = #CNPatches_Blueshift_Mod_ToggleMainPower
    }
    @MODULE[WBIWarpEngine]
    {
        @moduleDescription = #CNPatches_Blueshift_Mod_WarpEngineDesc
    }
    @MODULE[ModulePartVariants]
    {
        @VARIANT[Rover]
        {
            @displayName = #CNPatches_Blueshift_B2_Rover
        }
        @VARIANT[Station]
        {
            @displayName = #CNPatches_Blueshift_B2_Station
        }
    }
}

@PART[wbiB2FusionReactor]:NEEDS[WildBlueIndustries/Buffalo2,WildBlueIndustries/Blueshift]:FINAL
{
    @title = #CNPatches_Blueshift_B2_Reactor
    @description = #CNPatches_Blueshift_B2_ReactorDesc
    @manufacturer = #CNPatches_Blueshift_Part_manufacturerWildBlueIndustries
    @MODULE[WBIModuleGeneratorFX]
    {
        @ConverterName = #CNPatches_Blueshift_B2_Power
        @moduleDescription = #CNPatches_Blueshift_B2_PowerDesc
        @StartActionName = #CNPatches_Blueshift_B2_PowerStart
        @StopActionName = #CNPatches_Blueshift_B2_PowerStop
        @ToggleActionName = #CNPatches_Blueshift_B2_PowerToggle
    }
    @MODULE[ModulePartVariants]
    {
        @VARIANT[Rover]
        {
            @displayName = #CNPatches_Blueshift_B2_Rover
        }
        @VARIANT[Station]
        {
            @displayName = #CNPatches_Blueshift_B2_Station
        }
        @VARIANT[Superstructure]
        {
            @displayName = #CNPatches_Blueshift_B2_Structure
        }
        @VARIANT[SuperstructureGray]
        {
            @displayName = #CNPatches_Blueshift_B2_Gray
        }
    }
}
