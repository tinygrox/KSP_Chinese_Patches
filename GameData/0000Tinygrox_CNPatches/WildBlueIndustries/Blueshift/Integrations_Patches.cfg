{
    %displayName = #CNPatches_Blueshift_Res_FusionPellets
}

@RESOURCE_DEFINITION[FusionPellets]:HAS[#abbreviation[FuP]]:NEEDS[WildBlueIndustries/Blueshift,!FarFutureTechnologies]:FINAL
{
    @abbreviation = #CNPatches_Blueshift_Res_FusionPelletsShort
}

@RESOURCE_DEFINITION[wbiElectroPlasma]:NEEDS[WildBlueIndustries/Blueshift]:FINAL
{
    %displayName = #CNPatches_Blueshift_Res_ElectroPlasma
}

// === Cross-Mod Integrations ===
@CCKCommonFilterConfig:NEEDS[WildBlueIndustries/Blueshift,CommunityCategoryKit]:FINAL
{
    @Item:HAS[#tag[cck-Blueshift]]
    {
        @name = #CNPatches_Blueshift_Integ_Category
    }
}

@PART[wbiS0Endcap,wbiS1Endcap,wbiS2Endcap,wbiMk2PropellantTank,wbiS2FTLPropellantTank,wbiS3FTLPropellantTank,wbiMk3S3AdapterTank,wbiGravioliumTank5S]:NEEDS[WildBlueIndustries/Blueshift,B9PartSwitch,!WildBlueIndustries/FlyingSaucers]:FINAL
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
    {
        @switcherDescription = #CNPatches_Blueshift_Integ_TankType
    }
}

@PART[fft-regolith-scoop-1,fft-regolith-scoop-2]:NEEDS[WildBlueIndustries/Blueshift,FarFutureTechnologies,!WildBlueIndustries/FlyingSaucers]:FINAL
{
    @MODULE[ModuleSystemHeatHarvester]:HAS[#moduleID[harvester],#ResourceName[Graviolium]]
    {
        @ConverterName = #CNPatches_Blueshift_Integ_GravioliumHarvester
        @StartActionName = #CNPatches_Blueshift_Integ_StartGravioliumHarvester
        @StopActionName = #CNPatches_Blueshift_Integ_StopGravioliumHarvester
        @ToggleActionName = #CNPatches_Blueshift_Integ_ToggleGravioliumHarvester
    }
}

@PART[ISRU]:NEEDS[WildBlueIndustries/Blueshift,!FarFutureTechnologies]:FINAL
{
    @MODULE[ModuleResourceConverter]:HAS[#resourceOutputName[Fusion?Pellets],@OUTPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]]
    {
        @ConverterName = #CNPatches_Blueshift_Res_FusionPellets
        @StartActionName = #CNPatches_Blueshift_Integ_StartFusionPellets
        @StopActionName = #CNPatches_Blueshift_Integ_StopFusionPellets
        @resourceOutputName = #CNPatches_Blueshift_Res_FusionPellets
    }
}

