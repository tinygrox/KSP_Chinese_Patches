        #LOC_BLUESHIFT_flexGravGroup = 柔性引力 // Flex Grav
        #LOC_BLUESHIFT_flexGravTitle = S-2 柔性引力发生器 // S-2 Flex Grav Generator (原 en-us.cfg 重复定义两次，KSP 取后者 S-2 版本)
        #LOC_BLUESHIFT_flexGravDesc = S-2 柔性引力发生器可重定向最多 95% 的当地重力，将其转化为向上的升力、向前的推力，或两者的组合。适合贴近大气层飞行、辅助起飞和在天体附近精细机动。高度越高，当地重力越弱，装置作用也随之减小。额定工作环境为 1 g。在更强的重力场中仍可使用，但效果会减弱，增装多台可弥补这一损失。 // The S-2 FlexGrav Generator redirects local gravity into useful acceleration, providing lift, forward thrust, or a blend of both. It can bend up to 95% of the surrounding gravitational force, making it ideal for atmospheric skimming, assisted takeoff, and precision maneuvering near celestial bodies. Performance decreases with altitude as the local gravity field weakens. Rated for 1g service, the S-2 can operate in stronger gravity fields, but pilots should expect reduced effectiveness unless additional generators are installed. (原 en-us.cfg 重复定义两次，KSP 取后者 S-2 版本)
