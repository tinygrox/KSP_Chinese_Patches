        #LOC_BLUESHIFT_inertialDampenerTitle = S-2 零点惯性阻尼器 // S-2 Zero-Point Inertial Dampener
        #LOC_BLUESHIFT_inertialDampenerDesc = 这台装置以引力素供能，在引擎点火时扰动飞船及尾流周围的量子真空，从而减小惯性阻力。飞船账面质量照旧，推力更大、比冲更高，点火也能持续更久。惯性去哪儿了？别问。 // Powered by Graviolium, this device disturbs the quantum vacuum around your ship and its exhaust stream, reducing inertial resistance during engine burns. The result? More thrust, better ISP, and longer burns- all without changing your mass on paper. Where does the inertia go? Don't ask.
        #LOC_BLUESHIFT_dampenerGroup = 惯性阻尼器 // Inertial Dampener
        #LOC_BLUESHIFT_dampenerConverterTitle = 零点惯性阻尼器 // Zero-Point Inertial Dampener
        #LOC_BLUESHIFT_dampenerConverterDesc = 降低惯性质量，从而提高发动机的有效推力和比冲。 // Reduces inertial mass, effectively improving engine thrust and ISP.
