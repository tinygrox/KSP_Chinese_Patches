        #LOC_BLUESHIFT_insufficientSkill = 需要一名至少 <<1>> 星且具备维修技能的坎巴拉人。 // A <<1>>-star kerbal with the Repair Skill is needed to perform maintenance.
        #LOC_BLUESHIFT_insufficientKits = 维修共需 <<1>> 套舱外维修套件。 // You need a total of <<1>> EVA Repair Kits to perform maintennance.
        #LOC_BLUESHIFT_capacitor1Title = SC-400 静电荷转换器 // SC-400 Static Charge Converter
        #LOC_BLUESHIFT_capacitor1Desc = 这项先进技术把积累的静电荷导入电容器。充满后，转换器会给自己放一次电，把静电荷转成可用电量。可惜它挨不了几次电击，罢工之后就得维修或更换。 // This advanced technology helps solve the problem with static charge buildup by shunting the static charge into its capacitors. Once full, it zaps itself to convert Static Charge into Electric Charge. Unfortunately, there's only so many times that the converter can zap itself before it ragequits and must be repaired or replaced.
        #LOC_BLUESHIFT_noGeneratorsFound = 船上没有引力位移发生器。 // No Gravimetric Generators found on the ship.
