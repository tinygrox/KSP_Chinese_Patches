        #LOC_BLUESHIFT_plannerResourceBalancingCurrentDesc = <color=white><b>船上现有燃料量</b></color> // <color=white><b>Current resource amounts</b></color>
        #LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverTitle = QE-1 量子纠缠收发机 // QE-1 Quantum Entanglement Transceiver
        #LOC_BLUESHIFT_wbiQuantumEntanglementTransceiverDesc = QE-1 利用成对纠缠的亚原子粒子，跨越任意距离即时传输遥测数据。只要另一端也有一台量子纠缠收发机，量子非定域性就能绕过常规通信的遮挡和距离限制。 // Utilizing tightly bound pairs of entangled subatomic particles, the QE-1 delivers instantaneous, zero-latency telemetry data across infinite distances. Because it operates via quantum non-locality, it completely bypasses standard signal blockage and range limitations- so long as there is another QET on the other end.
        #LOC_BLUESHIFT_wbiAlienJumpGateTitle = 异常跃迁门 // Jump Gate Anomaly
        #LOC_BLUESHIFT_wbiAlienJumpGateDesc = 一座巨大的环状异常构造，能够瞬间把飞船送往星海彼端。 // A large, ring-shaped anomaly that provides instant transport across the expanse.
        #LOC_BLUESHIFT_wbiAstriaPortaControlTitle = 星门控制核心（旧款） // Astria Porta Arbitrium
        #LOC_BLUESHIFT_wbiAstriaPortaControlDesc = 我们先[保密]了[保密]，研究之后又对[保密]进行了[保密]，随后还[保密]了[保密]，终于造出了这个星门控制核心。给它装上九个星门环段，就能组成一座跃迁门，瞬间跨越漫长距离，抵达选定的目标门。 // After studying the [REDACTED] that we [REDACTED], we [REDACTED] the [REDACTED] and then [REDACTED] the [REDACTED] in order to create the Astria Porta Arbitrium. Combined with nine Astria Porta Support Segments, the Arbitrium forms a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
        #LOC_BLUESHIFT_wbiS1WarpCoilTitle = S-1 曲速线圈（旧款） // S-1 Warp Coil
        #LOC_BLUESHIFT_wbiS1WarpCoilDesc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出远低于 S-3 曲速引擎自带的大型环状线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
        #LOC_BLUESHIFT_wbiS2WarpCoilTitle = S-2 曲速线圈（旧款） // S-2 Warp Coil
        #LOC_BLUESHIFT_wbiS2WarpCoilDesc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出远低于 S-3 曲速引擎自带的大型环状线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
        #LOC_BLUESHIFT_wbiMk2FusionReactorTitle = Mk2 聚变反应堆 // Mk2 Fusion Reactor
        #LOC_BLUESHIFT_wbiMk2FusionReactorDesc = 这台磁流体动力聚变反应堆消耗聚变燃料丸来发电。 // This magneto hydrodynamic fusion reactor consumes fusion pellets to produce electric charge.
        #LOC_BLUESHIFT_wbiS2FusionReactorTitle = S-2 聚变反应堆 // S-2 Fusion Reactor
        #LOC_BLUESHIFT_wbiS2FusionReactorDesc = 这台磁流体动力聚变反应堆消耗聚变燃料丸来发电。 // This magneto hydrodynamic fusion reactor consumes fusion pellets to produce electric charge.
        #LOC_BLUESHIFT_wbiS3FusionReactorTitle = S-3 聚变反应堆 // S-3 Fusion Reactor
        #LOC_BLUESHIFT_wbiS3FusionReactorDesc = 这台磁流体动力聚变反应堆消耗聚变燃料丸来发电。 // This magneto hydrodynamic fusion reactor consumes fusion pellets to produce electric charge.
        #LOC_BLUESHIFT_wbiMk2GraviticGeneratorTitle = Mk2 引力位移发生器 // Mk2 Gravimetric Displacement Generator
        #LOC_BLUESHIFT_wbiMk2GraviticGeneratorDesc = 回旋加速器取代了粒子加速环，让这台发生器比 S-3 曲速引擎内的发生器紧凑许多，代价是引力波输出降低。坎巴拉人用自研技术复现了从[保密]回收的部件所能实现的功能。 // Using a cyclotron instead of a particle accelerator ring gives the gravitic displacement generator a much more compact form than the S-3 Warp Engine's generator, but it comes at the expense of reduced gravity wave output. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiMk2MultiCoilTitle = Mk2 多段曲速线圈 // Mk2 Warp Coil (Multi)
        #LOC_BLUESHIFT_wbiMk2MultiCoilDesc = 这套多段式线圈由一串小环组成，能产生超光速航行所需的曲速容量。 // This multi-segmented warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel.
        #LOC_BLUESHIFT_wbiMk2WarpCoilTitle = Mk2 曲速线圈 // Mk2 Warp Coil
        #LOC_BLUESHIFT_wbiMk2WarpCoilDesc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出低于 Mk2 多段曲速线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the Mk2 Warp Coil, however.
        #LOC_BLUESHIFT_wbiMk2WarpCoreTitle = Mk2「星际飞行」曲速核心 // Mk2 "Starflight" Warp Core
        #LOC_BLUESHIFT_wbiMk2WarpCoreDesc = Mk2「星际飞行」曲速核心专为航天飞机设计，可与 Mk2 曲速环对接，也能搭配其他类型的曲速线圈。有些组件是从[保密]处[保密]来的，原理还没搞懂，不过它大概能[保密]，让飞船跑得比光还快。 // The Mk2 "Starflight" Warp Core is specially designed for space planes. it can dock with the Mk2 Warp Ring or make use of other types of warp coils. Some components were [REDACTED] from [REDACTED] and aren’t well understood, but they should work [REDACTED] to propel a vessel faster than light.
        #LOC_BLUESHIFT_wbiMk2WarpRingTitle = Mk2 曲速环 // Mk2 Warp Ring
        #LOC_BLUESHIFT_wbiMk2WarpRingDesc = 这款曲速环可单独发射并留在轨道上。环上配有一个对接口，兼容 Mk2 曲速核心和 Mk2 引力位移发生器。 // Designed to be launched separately and left in orbit, this warp ring has a docking port that is compatible with the Mk2 Warp Core and Mk2 Gravimetric Dispacement Generator.
        #LOC_BLUESHIFT_wbiS0BussardCollectorTitle = S-0 电磁星尘收集器 // S-0 Bussard Collector
        #LOC_BLUESHIFT_wbiS0EndcapTitle = S-0 超光速端盖储箱 // S-0 FTL Endcap Tank
        #LOC_BLUESHIFT_wbiS0EndcapDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiS0MultiCoilTitle = S-0 多段曲速线圈 // S-0 Warp Coil (Multi)
        #LOC_BLUESHIFT_wbiS0MultiCoilDesc = 这套多段式线圈由一串小环组成，能产生超光速航行所需的曲速容量。 // This multi-segmented warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel.
        #LOC_BLUESHIFT_wbiS0PlasmaVentTitle = S-0 等离子体排气口 // S-0 Plasma Vent
        #LOC_BLUESHIFT_wbiS0WarpCoilTitle = S-0 曲速线圈 // S-0 Warp Coil
        #LOC_BLUESHIFT_wbiS0WarpCoilDesc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出远低于 S-3 曲速引擎自带的大型环状线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
        #LOC_BLUESHIFT_wbiS1GravimetricGeneratorTitle = S-1 引力位移发生器 // S-1 Gravimetric Displacement Generator
        #LOC_BLUESHIFT_wbiS1GravimetricGeneratorDesc = 回旋加速器取代了粒子加速环，让这台发生器比 S-3 曲速引擎内的发生器紧凑许多，代价是引力波输出降低。它把从[保密]回收的组件和坎巴拉自研部件拼在了一起。 // Using a cyclotron instead of a particle accelerator ring gives the gravitic displacement generator a much more compact form than the S-3 Warp Engine's generator, but it comes at the expense of reduced gravity wave output. It uses a combination of components salvaged from [REDACTED] and kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiS1MultiCoilTitle = S-1 多段曲速线圈 // S-1 Warp Coil (Multi)
        #LOC_BLUESHIFT_wbiS1MultiCoilDesc = 这套多段式线圈由一串小环组成，能产生超光速航行所需的曲速容量。 // This multi-segmented warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel.
        #LOC_BLUESHIFT_wbiS1WarpCoil2Title = S-1 曲速线圈 // S-1 Warp Coil
        #LOC_BLUESHIFT_wbiS1WarpCoil2Desc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出远低于 S-3 曲速引擎自带的大型环状线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
        #LOC_BLUESHIFT_wbiS1WarpCoreTitle = S-1「太空探索」曲速核心 // S-1 "Space Quest" Warp Core
        #LOC_BLUESHIFT_wbiS1WarpCoreDesc = 这台曲速核心靠着几件[保密]组件，为飞船提供超光速飞控。它由引力位移发生器供能，再把能量送入曲速线圈，沿预定航向扭曲空间。 // This Warp Core provides flight control for faster than light travel thanks in part to its [REDACTED] components. It is powered by gravitic generators and it channels their energy into warp coils that warp space in the desired direction of travel.
        #LOC_BLUESHIFT_wbiS2GravimetricGeneratorTitle = S-2 引力位移发生器 // S-2 Gravimetric Displacement Generator
        #LOC_BLUESHIFT_wbiS2GravimetricGeneratorDesc = 回旋加速器取代了粒子加速环，让这台发生器比 S-3 曲速引擎内的发生器紧凑许多，代价是引力波输出降低。它把从[保密]回收的组件和坎巴拉自研部件拼在了一起。 // Using a cyclotron instead of a particle accelerator ring gives the gravitic displacement generator a much more compact form than the S-3 Warp Engine's generator, but it comes at the expense of reduced gravity wave output. It uses a combination of components salvaged from [REDACTED] and kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiS2MultiCoilTitle = S-2 多段曲速线圈 // S-2 Warp Coil (Multi)
        #LOC_BLUESHIFT_wbiS2MultiCoilDesc = 这套多段式线圈由一串小环组成，能产生超光速航行所需的曲速容量。 // This multi-segmented warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel.
        #LOC_BLUESHIFT_wbiS2WarpCoil2Title = S-2 曲速线圈 // S-2 Warp Coil
        #LOC_BLUESHIFT_wbiS2WarpCoil2Desc = 这套线圈采用一串小环产生超光速航行所需的曲速容量，输出远低于 S-3 曲速引擎自带的大型环状线圈。 // Instead of one large ring shape, this warp coil uses a series of smaller rings to generate the warp capacity needed for faster than light travel. Its output is considerably less than the S-3 Warp Engine’s warp coil, however.
        #LOC_BLUESHIFT_wbiS2WarpCoreTitle = S-2「行星边缘」曲速核心 // S-2 "Planet's Edge" Warp Core
        #LOC_BLUESHIFT_wbiS2WarpCoreDesc = 这台曲速核心靠着几件[保密]组件，为飞船提供超光速飞控。它由引力位移发生器供能，再把能量送入曲速线圈，沿预定航向扭曲空间。 // This Warp Core provides flight control for faster than light travel thanks in part to its [REDACTED] components. It is powered by gravitic generators and it channels their energy into warp coils that warp space in the desired direction of travel.
        #LOC_BLUESHIFT_wbiS32WarpRingTitle = S3–S2 曲速环 // S3-2 Warp Ring
        #LOC_BLUESHIFT_wbiS32WarpRingDesc = 这是一款径向安装的多用途曲速环。挂架可按需配置，以适配尺寸 3 或尺寸 2 的零件。 // This versatile, radially attached warp ring has configurable pylons for both Size 3 and Size 2 components.
        #LOC_BLUESHIFT_wbiS3GravimetricGeneratorTitle = S-3 引力位移发生器 // S-3 Gravimetric Displacement Generator
        #LOC_BLUESHIFT_wbiS3GravimetricGeneratorDesc = 回旋加速器取代了粒子加速环，让这台发生器比 S-3 曲速引擎内的发生器紧凑许多，代价是引力波输出降低。坎巴拉人用自研技术复现了从[保密]回收的部件所能实现的功能。 // Using a cyclotron instead of a particle accelerator ring gives the gravitic displacement generator a much more compact form than the S-3 Warp Engine's generator, but it comes at the expense of reduced gravity wave output. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiS3HeavyWarpSustainerTitle = S-3 重型曲速增效器 // S-3 Heavy Warp Sustainer
        #LOC_BLUESHIFT_wbiS3HeavyWarpSustainerDesc = S-3 重型曲速增效器提供额外的曲速容量，让更重的飞船突破光速，或让较轻的飞船飞得更快。坎巴拉人用自研技术复现了从[保密]回收的部件所能实现的功能。 // The S-3 Heavy Warp Sustainer produces additional Warp Capacity that enables more massive vessels to travel faster than light and/or smaller vessels to go even faster. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiS3Mk3WarpRingTitle = S3–Mk3 曲速环 // S3-Mk3 Warp Ring
        #LOC_BLUESHIFT_wbiS3Mk3WarpRingDesc = 这是一款径向安装的多用途曲速环。挂架可按需配置，以适配尺寸 3 或 Mk3 的零件。 // This versatile, radially attached warp ring has configurable pylons for both Size 3 and Mk3 components.
        #LOC_BLUESHIFT_wbiS3WarpCoreTitle = S-3「远航」曲速核心 // S-3 "Trek" Warp Core
        #LOC_BLUESHIFT_wbiS3WarpCoreDesc = S-3「远航」曲速核心靠着几件[保密]组件，为飞船提供超光速飞控。它由引力位移发生器供能，再把能量送入曲速线圈，沿预定航向扭曲空间。 // The S-3 “Trek” Warp Core provides flight control for faster than light travel thanks in part to its [REDACTED] components. It is powered by gravitic generators and it channels their energy into warp coils that warp space in the desired direction of travel.
        #LOC_BLUESHIFT_wbiS3WarpEngineTitle = S-3「星际前沿」曲速引擎 // S-3 "Star Frontiers" Warp Engine
        #LOC_BLUESHIFT_wbiS3WarpEngineDesc = S-3「星际前沿」曲速引擎是一台按比例缩小的原型机。有些组件是从[保密]处[保密]来的，原理还没搞懂，不过它大概能[保密]，让飞船跑得比光还快。 // The S-3 "Star Frontiers" Warp Engine is a sub-scale prototype. Some components were [REDACTED] from [REDACTED] and aren’t well understood, but they should work [REDACTED] to propel a vessel faster than light.
        #LOC_BLUESHIFT_wbiS3WarpSustainerTitle = S-3 曲速增效器 // S-3 Warp Sustainer
        #LOC_BLUESHIFT_wbiS3WarpSustainerDesc = S-3 曲速增效器提供额外的曲速容量，让更重的飞船突破光速，或让较轻的飞船飞得更快。坎巴拉人用自研技术复现了从[保密]回收的部件所能实现的功能。 // The S-3 Warp Sustainer produces additional Warp Capacity that enables more massive vessels to travel faster than light and/or smaller vessels to go even faster. Instead of relying on parts salvaged from [REDACTED], it uses kerbal-tech to achieve its capabilities.
        #LOC_BLUESHIFT_wbiMk2PropellantTankTitle = Mk2 超光速推进剂储箱 // Mk2 FTL Propellant Tank
        #LOC_BLUESHIFT_wbiMk2PropellantTankDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiGravioliumTank03Title = GR-03 引力素储箱 // GR-03 Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank03Desc = 针对采矿船优化的引力素专用储箱。 // Optimized for mining vessels, this tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiGravioliumTank06Title = GR-06 引力素储箱 // GR-06 Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank06Desc = 针对采矿船优化的引力素专用储箱。 // Optimized for mining vessels, this tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiGravioliumTank12Title = GR-12 引力素储箱 // GR-12 Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank12Desc = 针对采矿船优化的引力素专用储箱。 // Optimized for mining vessels, this tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiGravioliumTank25Title = GR-25 引力素储箱 // GR-25 Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank25Desc = 针对采矿船优化的引力素专用储箱。 // Optimized for mining vessels, this tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiGravioliumTank375Title = GR-375 引力素储箱 // GR-375 Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank375Desc = 针对采矿船优化的引力素专用储箱。 // Optimized for mining vessels, this tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiMk3S3AdapterTankTitle = Mk3–S3 转接储箱 // Mk3-S3 Adapter Tank
        #LOC_BLUESHIFT_wbiMk3S3AdapterTankDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiS1EndcapTitle = S-1 超光速端盖储箱 // S-1 FTL Endcap Tank
        #LOC_BLUESHIFT_wbiS1EndcapDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiS2EndcapTitle = S-2 超光速端盖储箱 // S-2 FTL Endcap Tank
        #LOC_BLUESHIFT_wbiS2EndcapDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiS2FTLPropellantTankTitle = S-2 超光速推进剂储箱 // S-2 FTL Propellant Tank
        #LOC_BLUESHIFT_wbiS2FTLPropellantTankDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiS3FTLPropellantTankTitle = S-3 超光速推进剂储箱 // S-3 FTL Propellant Tank
        #LOC_BLUESHIFT_wbiS3FTLPropellantTankDesc = 为长途远航设计的储箱，能同时装下供聚变反应堆使用的聚变燃料丸，以及为超光速引擎供能的引力素。 // Built to boldly go on extended voyages, this tank holds both Fusion Pellets to power fusion reactors, and Graviolium to power FTL engines.
        #LOC_BLUESHIFT_wbiGravioliumTank5STitle = GR-50S 球形引力素储箱 // GR-50S Spherical Graviolium Tank
        #LOC_BLUESHIFT_wbiGravioliumTank5SDesc = 针对采矿船优化的大型球形储箱，专门存放引力素。 // Optimized for mining vessels, this large spherical tank exclusively holds Graviolium.
        #LOC_BLUESHIFT_wbiStardustTitle = 「星尘」引力素收集器 // Stardust Graviolium Collector
        #LOC_BLUESHIFT_wbiStardustDesc = 要找高品位的引力素矿脉，首选是开采小行星和实地勘探。某些星球的磁层中也有尘埃状的引力素。只要轨道够高、电力够足，「星尘」引力素收集器就能慢慢积攒这些颗粒。 // While mining asteroids and prospecting yield the best veins of Graviolium, dust-form Graviolium does exist in the magnetospheres of certain worlds. The Stardust Graviolium Collector can slowly accumulate Graviolium over time given sufficient orbital altitude and ElectricCharge.
        #LOC_BLUESHIFT_wbiTetTitle = 太空四面体 // Space Tetrahedron
        #LOC_BLUESHIFT_wbiTetDesc = 一座巨大的石质四面体，压迫感十足。它或许会赐予你渊博的知识……也可能把你所在的星球表面夷为平地。 // A large and intimidating stone tetrahedron that might confer great knowlege... or obliterate the surface of your planet.
        #LOC_BLUESHIFT_wbiWormholeTitle = 虫洞 // Wormhole
        #LOC_BLUESHIFT_wbiWormholeDesc = 太空中一个硕大的球形空洞。 // A very large, spherical hole in space.
        #LOC_BLUESHIFT_wbiAstriaPortaTitle = 星门控制段 // Astria Porta
        #LOC_BLUESHIFT_wbiAstriaPortaDesc = 我们先[保密]了[保密]，研究之后又对[保密]进行了[保密]，随后还[保密]了[保密]，终于造出了这个星门控制段。给它装上九个星门环段，就能组成一座跃迁门，瞬间跨越漫长距离，抵达选定的目标门。 // After studying the [REDACTED] that we [REDACTED], we [REDACTED] the [REDACTED] and then [REDACTED] the [REDACTED] in order to create the Astria Porta. Combined with nine Astria Porta Auxilium segments, the Astria Porta forms a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
        #LOC_BLUESHIFT_wbiAstriaPortaAccommodareTitle = 星门发射转接架 // Astria Porta Accommodare
        #LOC_BLUESHIFT_wbiAstriaPortaAccommodareDesc = 一个简单实用的转接架，方便航天器将星门环段运入轨道。 // This simple but handy adapter helps spacecraft launch Astria Porta segments into orbit.
        #LOC_BLUESHIFT_wbiAstriaPortaSupportTitle = 星门环段 // Astria Porta Auxilium
        #LOC_BLUESHIFT_wbiAstriaPortaSupportDesc = 把这个环段装到星门控制段上，即可逐步拼成一座完整的跃迁门。完工后就能跨越漫长距离，瞬间抵达选定的目标门。 // Combined with the Astria Porta Arbitrium, the Auxilium forms part of a jumpgate that enables users to instantly traverse vast distances to a desired destination gate.
        #LOC_BLUESHIFT_wbiLowGravCompensatorTitle = 低重力补偿器 // Low-Grav Compensator
        #LOC_BLUESHIFT_wbiLowGravCompensatorDesc = 这台设备源自一次被判失败的反重力发生器实验，直到科学家发现只要反转极性就行。实验的失败催生了一个点子，在低重力天体上给漫游车施加向下的推力，模拟 1 g 环境下的驾驶体验。 // The Low-Grav Compensator is the result of a contragravity generator experiment that was considered to be a failure until scientists realized that they just needed to reverse the polarity. But the failure gave them an idea: give rovers a downward push on low-g worlds to simulate driving in a 1-g environment.
        #LOC_BLUESHIFT_wbiPlasmaContactorTitle = 等离子体接触器 // Plasma Contactor
        #LOC_BLUESHIFT_wbiPlasmaContactorDesc = 引力位移发生器在产生引力波时会积累静电荷。飞船上的静电荷过多时，发生器会停机。等离子体接触器在真空中喷出电离氙气来消除静电荷，在着陆、溅落或大气层内飞行时也能放电。 // Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. A plasma contactor eliminates the charge by venting ionized xenon gas in vacuum conditions, but if the craft is landed, splashed, or flying in an atmosphere then it can eliminate StaticCharge as well.
        #LOC_BLUESHIFT_wbiPlasmaContactorLargeTitle = 大型等离子体接触器 // Plasma Contactor (Large)
        #LOC_BLUESHIFT_wbiPlasmaContactorLargeDesc = 引力位移发生器在产生引力波时会积累静电荷。飞船上的静电荷过多时，发生器会停机。等离子体接触器在真空中喷出电离氙气来消除静电荷，在着陆、溅落或大气层内飞行时也能放电。 // Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. A plasma contactor eliminates the charge by venting ionized xenon gas in vacuum conditions, but if the craft is landed, splashed, or flying in an atmosphere then it can eliminate StaticCharge as well.
        #LOC_BLUESHIFT_wbiPlasmaContactorModuleTitle = 等离子体接触器舱段 // Plasma Contactor Module
        #LOC_BLUESHIFT_wbiPlasmaContactorModuleDesc = 引力位移发生器在产生引力波时会积累静电荷。空间站上积累的静电荷过多时，发生器会停机。这个空间站舱段既能消除静电荷，又能存下多到离谱的氙气。 // Gravimetric displacement generators produce StaticCharge when generating GravityWaves. If the vessel accumulates too much StaticCharge, then the generators will shut down. This space station module can not only get rid of the static charge, it has a crazy amount of XenonGas.
        #LOC_BLUESHIFT_resonatorTitle = 引力共振器 // Gravitic Resonator
        #LOC_BLUESHIFT_resonatorDesc = 一台可穿戴的引力场发生器，利用极化引力素暂时减小、改变或抵消附近物体所受重力。目标质量会显著影响场强和恢复时间。事后在低轨道上发现的物品不在保修范围内。 // A wearable gravitic field generator that uses polarized graviolium to temporarily reduce, redirect, or counteract the apparent weight of nearby objects. Field strength and recovery time vary considerably with target mass. Warranty does not cover objects subsequently discovered in low orbit.
        #LOC_BLUESHIFT_wbiMk2FusionThrusterTitle = Mk2 聚变推进器 // Mk2 Fusion Thruster
        #LOC_BLUESHIFT_wbiMk2FusionThrusterDesc = 小型引力催化聚变反应堆将推进工质加热至极高温度，产生高比冲推力，同时为内置的微型柔性引力系统供能。 // A compact, gravity-catalyzed fusion reactor superheats its reaction mass to generate thrust with high specific impulse while also powering a built-in, miniaturized FlexGrav system.
        #LOC_BLUESHIFT_fusionReactorConverterName = 聚变反应堆 // Fusion Reactor
        #LOC_BLUESHIFT_fusionReactorDesc = 消耗聚变燃料丸，产生电等离子体。 // Produces electro-plasma from fusion pellets.
        #LOC_BLUESHIFT_fusionReactorStartName = 启动聚变反应堆 // Activate Fusion Reactor
        #LOC_BLUESHIFT_fusionReactorStopName = 关闭聚变反应堆 // Deactivate Fusion Reactor
        #LOC_BLUESHIFT_fusionReactorToggleName = 开关聚变反应堆 // Toggle Fusion Reactor
        #LOC_BLUESHIFT_mhdConverterName = 磁流体发电机 // Magnetohydrodynamic Generator
        #LOC_BLUESHIFT_mhdReactorDesc = 让反应堆的等离子体流过磁能转换通道发电。 // Channels the reactor's plasma flow through a magnetic conversion channel to generate Electric Charge.
        #LOC_BLUESHIFT_mhdThrusterDesc = 从反应堆引出一小股等离子体，让它流过磁能转换通道发电。 // Diverts a small portion of the reactor’s plasma flow through a magnetic conversion channel to generate Electric Charge.
        #LOC_BLUESHIFT_fusionThrusterVentStartName = （调试）开始排放等离子体 // (Debug) star plasma venting
        #LOC_BLUESHIFT_fusionThrusterVentStopName = （调试）停止排放等离子体 // (Debug) stop plasma venting
        #LOC_BLUESHIFT_needsMaintenance = 需要维护 // Needs Maintenance (en-us.cfg 漏定义，由 Blueshift.dll 调用)

