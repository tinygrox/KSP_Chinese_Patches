        #LOC_BLUESHIFT_settingsJumpgatesDesc = 生成天然跃迁门 // Allow Jumpgates
        #LOC_BLUESHIFT_settingsJumpgatesTip = 允许在太空中发现跃迁门。玩家建造的跃迁门始终可用。 // Allows Jumpgate Anomalies to spawn in game. Player-built gates are unaffected.
        #LOC_BLUESHIFT_settingsDestructiveJumpgatesDesc = 跃迁门启动时摧毁门内物体 // Jumpgates: desctructive startup
        #LOC_BLUESHIFT_settingsDestructiveJumpgatesTip = 跃迁门启动时请避开门口！ // Stay clear of a jumpgate starting up!
        #LOC_BLUESHIFT_settingsJumpMaxDesc = 限制跃迁门的通行尺寸 // Jumpgates restrict vessel dimensions
        #LOC_BLUESHIFT_settingsJumpMaxTip = 能从门里穿过去，就能运得走。 // If it fits, it ships
        #LOC_BLUESHIFT_settingsMaintenanceDesc = 零件需要维护 // Parts require maintenance
        #LOC_BLUESHIFT_settingsMaintenanceTip = 零件发生故障后，需要使用维修套件修理。 // If a part breaks down then it needs a Repair Kit to fix.
        #LOC_BLUESHIFT_settingsWarpDraggingDesc = 允许曲速场携带周围物体 // Enable warp dragging
        #LOC_BLUESHIFT_settingsWarpDraggingTip = 物理加载范围内的物体会随船进行曲速航行。仅在正常时间流速下生效。 // Objects in physics range travel with you during warp (Real-Time ONLY!).
        #LOC_BLUESHIFT_settingsWarpFieldEffectsDesc = 显示曲速场特效 // Enable warp field effects
        #LOC_BLUESHIFT_settingsWarpFieldEffectsTip = 显示 Waterfall 的大型曲速场和隧道特效。船首激波和曲速环尾焰始终按原设置显示。 // Displays the large Waterfall warp field and tunnel effects. The bow shock and warp ring plumes are unaffected.
