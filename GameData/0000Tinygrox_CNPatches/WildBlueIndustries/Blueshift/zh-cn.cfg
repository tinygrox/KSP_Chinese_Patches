        #CNPatches_Blueshift_Part_flexGravModuleDesc = 改变当地重力的方向，将其转化为升力或推力。 // Redirects local gravity.
        #CNPatches_Blueshift_Part_fftSwitchableTankDesc = 为长途远航设计的储箱。可配置为储存液态氘、引力素，或同时储存两者。 // A long-range tank configurable for liquid deuterium, Graviolium, or both.
        #CNPatches_Blueshift_Part_fftFixedTankDesc = 为长途远航设计的储箱，存放给超光速引擎供能的引力素。 // A long-range tank for the Graviolium that powers faster-than-light engines.
        #CNPatches_Blueshift_Part_wbiSaucerTechnologiesTitle = 飞碟技术 // Saucer Technologies
        #CNPatches_Blueshift_Part_wbiSaucerTechnologiesDesc = 气象气球？这事大概没那么简单。 // Maybe it wasn't just a weather balloon.
        #CNPatches_Blueshift_Part_wbiGravityWaveApplicationsTitle = 引力波应用 // Gravity Wave Applications
        #CNPatches_Blueshift_Part_wbiGravityWaveApplicationsDesc = 引力波谐波的发现催生了一批新装置。大多数运转正常，有几台当场内爆，还有几台……飞走了。 // The discovery of Gravity Wave Harmonics triggered a flood of breakthrough devices. Most worked. Some imploded. Others... left.
        #CNPatches_Blueshift_Part_wbiWarpTechTitle = 曲速场理论 // Warp Field Theory
        #CNPatches_Blueshift_Part_wbiWarpTechDesc = 一套尖端技术，足以开启某种星际迷航。 // Highly advanced technologies for some kind of star trek.
        #CNPatches_Blueshift_Part_wbiJumpTechTitle = 跃迁技术 // Jump Technologies
        #CNPatches_Blueshift_Part_wbiJumpTechDesc = 炸了几十台原型机、听过任务控制中心无数次惊慌呼叫之后，跃迁技术终于迈入了「基本不爆炸」的阶段。 // After dozens of exploding prototypes and panicked mission control calls, jump technology has finally entered its Mostly Doesn't Explode phase.
        #CNPatches_Blueshift_Part_wbiAdvWarpTechTitle = 先进曲速技术 // Advanced Warp Tech
        #CNPatches_Blueshift_Part_wbiAdvWarpTechDesc = 勇敢地航向前人未至之境。 // To boldly go where no one has gone before.
        #CNPatches_Blueshift_Part_wbiMiniWarpTechTitle = 微型曲速技术 // Miniaturized Warp Tech
        #CNPatches_Blueshift_Part_wbiMiniWarpTechDesc = 扭曲宇宙的本事一应俱全，体积小了不少，也只稍微容易炸了一点。 // All the universe-bending power of conventional warp technology, now in a conveniently smaller and only slightly more explosive package.
        #CNPatches_Blueshift_Part_wbiAdvJumpTechTitle = 先进跃迁技术 // Advanced Jump Tech
        #CNPatches_Blueshift_Part_wbiAdvJumpTechDesc = 早期的跃迁引擎已经能送你去群星之间。这项技术让你到了那儿还能保住你的午饭、轨道和牙齿。 // Early jump engines got you to the stars. This tech helps you get there without losing your lunch, your orbit, or your teeth.
        #CNPatches_Blueshift_Part_wbiMiniJumpTechTitle = 微型跃迁技术 // Miniature Jump Tech
        #CNPatches_Blueshift_Part_wbiMiniJumpTechDesc = 耗时六个月，造了三台原型机，还惹恼了一只獾，终于有人问「如果把跃迁装置做小一点呢？」然后也不知怎么的……居然成了。 // It took six months, three prototypes, and a moderately angry badger, but someone finally asked, "What if we made jump tech smaller?" And somehow... it worked.

