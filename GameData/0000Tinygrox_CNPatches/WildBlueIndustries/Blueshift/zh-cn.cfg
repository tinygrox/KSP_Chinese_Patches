        #LOC_BLUESHIFT_dampenerStopName = 关闭惯性阻尼器 // Deactivate Inertial Dampener
        #LOC_BLUESHIFT_dampenerToggleName = 开关惯性阻尼器 // Toggle Inertial Dampener
        #LOC_BLUESHIFT_inertialDampenerFactor = 惯性阻尼系数 // Inertial Dampening Factor
