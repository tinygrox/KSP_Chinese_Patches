        #LOC_BLUESHIFT_miniJumpGateDesc = 在研究[保密]之后，我们造出了微型跃迁门。它能打开一条虫洞，瞬间跨越遥远距离，抵达选定的目标门。微型跃迁门的距离和可传送质量都有上限，可部署于天体表面或太空中。 // After studying the [REDACTED], we designed the Miniature Jumpgate. It forms a wormhole that enables users to instantly traverse vast distances to a desired destination gate. The Miniature Jumpgate has limited range and has a limit to the mass that it can transport, but it can be used on a celestial body as well as in space.
