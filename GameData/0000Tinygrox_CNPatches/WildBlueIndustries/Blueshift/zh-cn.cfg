        #CNPatches_Blueshift_B2_CoreDesc = 这枚小型核心借助部分[保密]组件控制超光速航行。它由引力发生器供能，并将能量导入曲速线圈，沿选定的航向扭曲空间。 // This Warp Core provides flight control for faster than light travel thanks in part to its [REDACTED] components. It is powered by gravitic generators and it channels their energy into warp coils that warp space in the desired direction of travel.
