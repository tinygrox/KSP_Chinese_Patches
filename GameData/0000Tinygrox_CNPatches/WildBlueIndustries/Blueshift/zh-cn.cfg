        #LOC_BLUESHIFT_pylonTypeATitle = A 型挂架 // Pylon Type A
        #LOC_BLUESHIFT_pylonTypeADesc = 工程师从能产生升力的平板结构汲取灵感，造出这种挂架，把曲速线圈等有潜在危险的设备装到远离居住区的位置。 // Inspired by flat board-like structures that generate lift, the Pylon provides a means to separate potentially hazardous devices like warp coils away from habitable areas.
